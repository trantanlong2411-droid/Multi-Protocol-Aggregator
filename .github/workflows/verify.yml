name: Pharos Multi-Protocol Aggregator — tests, Worker build and real Chain MCP
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Unit tests — both protocols, routing, unsigned actions and failover
        run: npm test
      - name: Wrangler build dry run
        run: npm run build
  real-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify deployed R25 and Zona contracts via official hosted Chain MCP
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pharos-multi-protocol-live-evidence
          path: proof/live-mcp.json
          retention-days: 30
          if-no-files-found: warn
